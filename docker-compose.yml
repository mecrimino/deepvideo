# Deep Vision — local orchestration.
#
# Two long-running services (Ch3 / Ch20):
#   core     — Python FastAPI + agent pipeline   (:8000)
#   backend  — Node Fastify API gateway          (:8787) → proxies /api to core
# The Vite frontend (:5173) proxies /api and /files to the gateway.
#
# For day-to-day dev you don't need Docker — run the three processes directly:
#   pip install -r requirements.txt
#   npm install
#   npm run dev:core       # FastAPI on :8000
#   npm run dev:backend    # gateway on :8787
#   npm run dev            # frontend on :5173
#
# The service definitions below describe the same topology for containerised
# runs. Add a core/Dockerfile and backend/Dockerfile to build them.
version: "3.9"

services:
  core:
    build: ./core
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./cache:/app/cache
      - ./projects:/app/projects
      - ./downloads:/app/downloads
      - ./temp:/app/temp
      - ./assets:/app/assets

  backend:
    build: ./backend
    command: npm run start
    env_file: .env
    environment:
      - CORE_URL=http://core:8000
    ports: ["8787:8787"]
    depends_on: [core]
    volumes:
      - ./cache:/app/cache
      - ./projects:/app/projects
      - ./temp:/app/temp
      - ./downloads:/app/downloads
